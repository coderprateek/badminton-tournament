<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}GOALS Badminton League 2026{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home') }}">GOALS Badminton League 2026</a>
    <nav>
      <a href="{{ url_for('home') }}">Groups</a>
      {% if is_admin %}
        <form class="inline" method="post" action="{{ url_for('logout') }}">
          <button type="submit" class="linkish">Sign out</button>
        </form>
        <span class="pill">Admin</span>
      {% else %}
        <a href="{{ url_for('login') }}">Admin login</a>
        <span class="pill muted">View only</span>
      {% endif %}
    </nav>
  </header>
  <main class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <p class="flash {{ category }}">{{ message }}</p>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
